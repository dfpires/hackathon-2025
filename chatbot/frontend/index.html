<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Notas</title>
  <style>
    /* ===== Estilos básicos ===== */
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* centraliza verticalmente */
    }

    /* Container do chat */
    #chat-container {
      width: 400px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column; /* organiza em coluna */
      overflow: hidden;
    }

    /* Área das mensagens */
    #messages {
      flex: 1; /* ocupa todo o espaço disponível */
      padding: 15px;
      overflow-y: auto; /* barra de rolagem quando cheio */
    }

    /* Estilo genérico de mensagens */
    .message {
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%; /* largura máxima da bolha */
    }

    /* Mensagens do bot (cinza, à esquerda) */
    .bot {
      background: #e0e0e0;
      align-self: flex-start;
    }

    /* Mensagens do usuário (verde, à direita) */
    .user {
      background: #4caf50;
      color: white;
      align-self: flex-end;
    }

    /* Container de entrada (campo + botão) */
    #input-container {
      display: flex;
      border-top: 1px solid #ccc;
    }

    /* Campo de texto */
    #input {
      flex: 1; /* ocupa o espaço todo */
      border: none;
      padding: 10px;
      font-size: 16px;
    }

    /* Botão de enviar */
    #send {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Estrutura principal do chatbot -->
  <div id="chat-container">
    <div id="messages"></div> <!-- Onde as mensagens aparecem -->
    <div id="input-container">
      <input id="input" type="text" placeholder="Digite aqui..." />
      <button id="send">Enviar</button>
    </div>
  </div>

  <script>
    // ===== Seleciona elementos do DOM =====
    const messagesEl = document.getElementById("messages"); // área de mensagens
    const inputEl = document.getElementById("input");       // campo de texto
    const sendBtn = document.getElementById("send");        // botão de enviar
    const sessionId = Date.now(); // cria um ID único simples para a sessão

    /**
     * Adiciona uma nova mensagem na tela
     * @param {string} content - Texto da mensagem
     * @param {string} sender - "user" ou "bot" para aplicar estilos
     */
    function addMessage(content, sender) {
      const div = document.createElement("div");
      div.classList.add("message", sender); // aplica classes CSS
      div.textContent = content;
      messagesEl.appendChild(div); // adiciona no chat
      messagesEl.scrollTop = messagesEl.scrollHeight; // rola para o fim
    }

    /**
     * Envia a mensagem do usuário para o backend e exibe a resposta do bot
     */
    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return; // não envia vazio

      // Exibe a mensagem do usuário imediatamente
      addMessage(message, "user");
      inputEl.value = ""; // limpa o campo de texto

      // Faz requisição POST para o backend em Node.js
      const res = await fetch("http://localhost:3000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message })
      });

      // Converte resposta em JSON
      const data = await res.json();

      // Adiciona a resposta do bot no chat
      addMessage(data.reply, "bot");
    }

    // Eventos para enviar mensagem
    sendBtn.addEventListener("click", sendMessage); // clique no botão
    inputEl.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage(); // tecla Enter
    });

    // Mensagem inicial do bot (assim que abre a página)
    fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message: "" }) // mensagem vazia dispara início
    })
      .then(res => res.json())
      .then(data => addMessage(data.reply, "bot")); // mostra primeira fala do bot
  </script>
</body>
</html>
